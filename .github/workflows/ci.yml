name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Отменяем предыдущий прогон на той же ветке/PR, если пришёл новый пуш:
# гонять устаревший коммит смысла нет, только жжём минуты.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Версию берём из go.mod, чтобы CI и локальная сборка не разъезжались.
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # -race ловит гонки, которых у нас нет by design (агрегатор один). Тест это
      # проверяет, а не постулирует. На Linux-раннере race работает из коробки.
      - name: Test
        run: go test -race ./...

      - name: Build
        run: |
          go build ./cmd/loadgen
          go build ./cmd/loadgen-web

  # Образ веб-сервиса для формы на сайте: ghcr.io/hollowkaeden/loadgen-web.
  # Только на push в main и только после зелёных vet/test/build.
  image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hollowkaeden/loadgen-web:${{ github.sha }}
            ghcr.io/hollowkaeden/loadgen-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Сообщаем портфолио, что вышел новый образ: оно передеплоит сервер.
      # Токен: fine-grained PAT с Contents: read and write только на репо portfolio.
      - name: Trigger portfolio deploy
        env:
          TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::PORTFOLIO_DISPATCH_TOKEN не задан, деплой не запущен"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HollowKaeden/portfolio/dispatches \
            -d '{"event_type":"deploy","client_payload":{"source":"loadgen-web","sha":"${{ github.sha }}"}}'
          echo "Деплой портфолио запущен"
